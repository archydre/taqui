# Profile de teste (ativado por @ActiveProfiles("test") na AbstractIntegrationTest).
# As props daqui sobrescrevem as do application.properties principal (que continua valendo
# pro resto: app.jwt.secret, r2.*, etc.). O datasource é injetado pelo Testcontainers.

# Testcontainers cuida do banco; o docker-compose não deve subir nos testes.
spring.docker.compose.enabled=false

# Schema recriado do zero a cada execução, a partir das entidades.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
