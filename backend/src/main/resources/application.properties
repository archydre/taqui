spring.application.name=backend

# PostgreSQL (Docker - ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/taqui
spring.datasource.username=taqui
spring.datasource.password=taqui

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256 / HMAC)
app.jwt.secret=${JWT_SECRET:troque-por-uma-string-secreta-bem-longa-de-no-minimo-32-bytes}
app.jwt.expiration-minutes=60

# Cloudflare R2 (pra imagens (bucket) - S3-compatible)
r2.endpoint=${R2_ENDPOINT:https://2a0f844e6553c1329dc51df8351bf9ff.r2.cloudflarestorage.com}
r2.access-key-id=${R2_ACCESS_KEY_ID:cole-seu-access-key-id}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:cole-seu-secret-access-key}
r2.bucket=${R2_BUCKET:mybucket}
r2.region=auto
r2.public-base-url=${R2_PUBLIC_BASE_URL:https://pub-1e14b9daf16b430ca1cf2dbcbc3e30f2.r2.dev}
r2.presign-expiry-minutes=10

# CORS (origens do front liberadas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
